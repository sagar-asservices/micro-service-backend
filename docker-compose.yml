services:
  # MongoDB for all services (each can use its own db)
  mongodb:
    image: mongo:6
    container_name: mongo_container
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ms-network

  # rabbitmq:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - ms-network

  # User Service
  user-service:
    build: ./services/user-service
    container_name: user_service
    ports:
      - "5001:5001"
    env_file:
      - ./services/user-service/.env
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - ms-network

  # Product Service
  product-service:
    build: ./services/product-service
    container_name: product_service
    ports:
      - "5002:5002"
    env_file:
      - ./services/product-service/.env
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - ms-network

  # Order Service
  order-service:
    build: ./services/order-service
    container_name: order_service
    ports:
      - "5003:5003"
    env_file:
      - ./services/order-service/.env
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - ms-network

  # API Gateway
  api_gateway:
    build: ./api-gateway
    container_name: api_gateway
    ports:
      - "5000:5000"
    depends_on:
      - user-service
      - order-service
      - product-service
      - rabbitmq
    networks:
      - ms-network

volumes:
  mongo_data:
  rabbitmq-data:

networks:
  ms-network:
    driver: bridge
